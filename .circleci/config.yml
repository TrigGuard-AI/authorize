version: 2.1

# The existing GitHub workflow only runs when someone starts it.
# This checks that the action still builds on every pull request.
jobs:
  action_build:
    docker:
      - image: cimg/node:20.19.0
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install and build the action
          command: |
            set -euo pipefail
            npm ci
            npm run build

workflows:
  action_checks:
    jobs:
      - action_build
